# main -> prod hub (token minted from AUX4_PUBLISHER_* client credentials against prod SSO)
# dev  -> dev hub  (token minted from AUX4_DEV_PUBLISHER_* client credentials against dev SSO;
#         registry pointed at the dev hub). Both call aux4/action@v1 command:publish.
name: Publish Package

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'

  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  test-linux:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # aux4/ai-rag (a dependency, learn/search/forget) only reaches the prod hub when it is
      # promoted, so off main install it from the dev hub first; the test step below then finds
      # it already installed (aux4 and pkger too) and installs everything else from the prod hub
      # as usual.
      - name: Install aux4/ai-rag from the dev hub
        if: github.ref_name != 'main'
        shell: bash
        run: |
          curl -fsSL https://aux4.sh | sh
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"
          export PATH="$HOME/.aux4.config/packages/aux4/aux4:$PATH"
          curl -fsSL https://pkger.aux4.sh | sh
          AUX4_REGISTRY_URL=https://dev.api.hub.aux4.io/v1/packages aux4 aux4 pkger install aux4/ai-rag
          aux4 aux4 pkger list

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - uses: aux4/action@v1
        with:
          command: test
          build_command: npm run build

  test-darwin:
    needs: [lint]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # aux4/ai-rag (a dependency, learn/search/forget) only reaches the prod hub when it is
      # promoted, so off main install it from the dev hub first; the test step below then finds
      # it already installed (aux4 and pkger too) and installs everything else from the prod hub
      # as usual.
      - name: Install aux4/ai-rag from the dev hub
        if: github.ref_name != 'main'
        shell: bash
        run: |
          curl -fsSL https://aux4.sh | sh
          echo "$HOME/.aux4.config/packages/aux4/aux4" >> "$GITHUB_PATH"
          export PATH="$HOME/.aux4.config/packages/aux4/aux4:$PATH"
          curl -fsSL https://pkger.aux4.sh | sh
          AUX4_REGISTRY_URL=https://dev.api.hub.aux4.io/v1/packages aux4 aux4 pkger install aux4/ai-rag
          aux4 aux4 pkger list

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - uses: aux4/action@v1
        with:
          command: test
          build_command: npm run build

  publish:
    needs: [test-linux, test-darwin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Mint prod hub publish token
        id: mint
        if: github.ref_name == 'main'
        env:
          CLIENT_ID: ${{ secrets.AUX4_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      # The dev hub is validated by dev SSO, so a prod token is rejected there.
      - name: Mint dev hub publish token
        id: devmint
        if: github.ref_name == 'dev'
        env:
          CLIENT_ID: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::dev publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://dev.sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token from dev SSO"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Publish package
        uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level || 'patch' }}
          # dev -> minted dev token + dev hub registry; main -> minted prod token + default (prod) hub
          aux4_token: ${{ github.ref_name == 'dev' && steps.devmint.outputs.token || steps.mint.outputs.token }}
          registry: ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io/v1/packages' || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}