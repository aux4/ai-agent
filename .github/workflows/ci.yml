name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # faiss-node compiles from source when its prebuilt binary cannot be downloaded; that needs BLAS/LAPACK.
      - name: Install BLAS/LAPACK for faiss-node
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev liblapack-dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # faiss-node compiles from source when its prebuilt binary cannot be downloaded; that needs BLAS/LAPACK.
      - name: Install BLAS/LAPACK for faiss-node
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev liblapack-dev

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - uses: aux4/action@v1
        with:
          command: test
          build_command: npm run build
